spring.application.name=personal-expense-tracker

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

app.jwtSecret=${JWT_SECRET:mySuperSecretJwtKeyForPersonalExpenseTrackerApplication1234567890}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework.security=INFO
logging.level.com.expense=DEBUG
